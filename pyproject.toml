[project]
name = "briefing"
version = "0.1.0"
description = "LinkedIn 알림 메일을 읽어 AI 관련 게시물을 요약·발송하는 일일 배치"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic",
    "beautifulsoup4",
    "pyyaml",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/briefing"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
