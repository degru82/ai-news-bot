# 이 파일을 .github/workflows/wiki-sync.yml 로 옮겨 주세요.
# (GitHub App 권한상 Claude가 .github/workflows 아래에 직접 쓸 수 없어 여기에 둡니다.)
#
# 사전 조건: 저장소 Settings > Features 에서 Wikis 를 켜고, 웹에서 첫 페이지를 한 번 만들어
# `<repo>.wiki.git` 이 존재하게 해야 한다.
name: Wiki Sync

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - "src/briefing/wiki_sync.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-out

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Convert docs/wiki -> wiki pages
        run: uv run python -m briefing.wiki_sync --src docs/wiki --out wiki-out

      - name: Commit and push
        working-directory: wiki-out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "docs: sync from ${GITHUB_SHA::7}"
          git push
